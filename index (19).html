<!DOCTYPE html>
<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What I Promised — ما وعدتُكِ به</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0B0920;display:flex;justify-content:center;color:#FFFFFF;-webkit-font-smoothing:none}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;min-height:640px;overflow:hidden;font-family:'Handjet',sans-serif}
html[lang=en] .phone{font-family:'DotGothic16',monospace}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:24px 20px 20px;gap:14px}
.screen.on{display:flex}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.rel{position:relative;z-index:1}
.dot{font-family:'DotGothic16',monospace}
.hd{font-family:'Blaka',serif;font-weight:400}
html[lang=en] .hd{font-family:'DotGothic16',monospace}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .grp{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
.chip{font-family:'DotGothic16',monospace;font-size:13px;letter-spacing:2px;background:#14102E;padding:6px 10px;color:#FFE066}
.lang{display:flex;background:#14102E;box-shadow:0 0 0 3px #FFFFFF}
.lang button{width:44px;height:44px;border:0;border-radius:0;background:transparent;color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lang .ar{font-family:'Handjet',sans-serif;font-size:21px;font-weight:700}
.lang .en{font-family:'DotGothic16',monospace;font-size:15px}
.lang button[aria-pressed=true]{background:#FFE066;color:#14102E}
.back{width:44px;height:44px;border:0;border-radius:0;background:#241E52;box-shadow:0 0 0 3px #FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.flip{transform:scaleX(-1)}
html[dir=ltr] .flipr{transform:scaleX(-1)}
.win{background:#241E52;box-shadow:0 -4px 0 0 #FFFFFF,0 4px 0 0 #FFFFFF,-4px 0 0 0 #FFFFFF,4px 0 0 0 #FFFFFF,inset 0 0 0 4px #5A4FB0;margin:0 4px}
.plate{position:absolute;top:-19px;inset-inline-start:14px;min-height:34px;padding:0 14px;display:flex;align-items:center;background:#FF5C93;color:#14102E;font-size:19px;font-weight:700;box-shadow:0 0 0 3px #FFFFFF}
html[lang=en] .plate{font-size:15px;font-weight:400}
.yes{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 14px;border:0;border-radius:0;background:#FFE066;color:#14102E;font:inherit;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 0 0 3px #FFFFFF,6px 6px 0 3px #FF5C93}
html[lang=en] .yes{font-size:18px;font-weight:400}
.yes:active,.mood:active,.card:active{transform:translate(2px,2px)}
.err{min-height:0;color:#FFB8CD;font-size:18px;line-height:1.5}
html[lang=en] .err{font-size:14px}
.err:empty{display:none}
input.name{height:52px;border:0;border-radius:0;padding:0 14px;font:inherit;font-size:22px;color:#14102E;background:#F4F0FF;box-shadow:inset 4px 4px 0 0 #A79EE0;width:100%;outline:none}
html[lang=en] input.name{font-size:16px}
input.name:focus{box-shadow:inset 4px 4px 0 0 #A79EE0,0 0 0 3px #FFE066}
.link{background:none;border:0;color:#C9C2F0;font:inherit;font-size:19px;cursor:pointer;min-height:44px;text-align:start;padding:0 12px}
html[lang=en] .link{font-size:15px}
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 6px}
.mood{min-height:56px;padding:6px 8px;line-height:1.3;border:0;border-radius:0;font:inherit;font-size:19px;font-weight:500;background:#F4F0FF;color:#14102E;cursor:pointer;box-shadow:0 0 0 3px #14102E,4px 4px 0 3px #14102E}
html[lang=en] .mood{font-size:14px}
.mood[aria-pressed=true]{background:#FFE066;font-weight:700;box-shadow:0 0 0 3px #14102E,4px 4px 0 3px #FF5C93}
.say{margin:0;font-size:23px;line-height:1.7;white-space:pre-line}
html[lang=en] .say{font-size:17px}
.say b{color:#FFE066;font-weight:inherit}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:6px}
.card{position:relative;border:0;border-radius:0;padding:0;background:#241E52;color:#FFFFFF;font:inherit;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 0 0 4px #FFFFFF;text-align:start}
.card .pic{width:100%;height:clamp(100px,calc((100dvh - 390px) / 2),210px);background:#2D2566;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .nm{padding:8px 10px;font-size:19px;font-weight:700;line-height:1.2;min-height:44px;display:flex;align-items:center}
html[lang=en] .card .nm{font-size:13px;font-weight:400}
.card[aria-pressed=true]{box-shadow:0 0 0 4px #FFE066,6px 6px 0 4px #FF5C93}
.card[aria-pressed=true] .nm{background:#FFE066;color:#14102E}
.pic img,.sprite img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;image-rendering:auto}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#C9C2F0;font-size:15px;text-align:center;padding:8px;width:100%;height:100%}
.row{display:flex;gap:12px;margin:0 4px}
.surprise{flex:0 0 auto;min-height:52px;padding:0 14px;border:0;border-radius:0;background:#14102E;color:#FFFFFF;font:inherit;font-size:19px;cursor:pointer;box-shadow:0 0 0 3px #5A4FB0;display:flex;align-items:center;gap:8px}
.surprise .q{font-family:'DotGothic16',monospace;color:#FF5C93;font-size:20px}
html[lang=en] .surprise{font-size:14px}
.banner{align-self:center;background:#14102E;padding:8px 14px;box-shadow:0 0 0 3px #FFFFFF;margin:0;font-size:24px;text-align:center;max-width:100%}
html[lang=en] .banner{font-size:15px}
.banner b{color:#FFE066;font-weight:inherit}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-120px}
.sprite{width:min(72%,290px);height:calc(100% + 0px);max-height:480px;min-height:240px;background:#FFFFFF;box-shadow:0 0 0 4px #14102E;overflow:hidden}
.sprite .ph{color:#14102E}
.dlg{position:relative;padding:28px 18px 32px;cursor:pointer;min-height:132px}
#charSay{max-height:30vh;overflow-y:auto}
.caret{position:absolute;bottom:10px;inset-inline-end:14px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tools button{min-height:48px;border:0;border-radius:0;background:#14102E;color:#FFFFFF;font:inherit;font-size:19px;font-weight:500;cursor:pointer;box-shadow:0 0 0 2px #FFFFFF}
html[lang=en] .tools button{font-size:13px;color:#FFE066}
.petal{position:absolute;top:-12px;width:8px;height:8px;background:#FF8FB1;z-index:0;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(-60px,110vh)}}
@media (prefers-reduced-motion:reduce){.petal,.caret{animation:none}.petal{display:none}}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(11,9,32,.82);display:none;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex}
.logwin{width:100%;max-height:80%;display:flex;flex-direction:column;padding:28px 16px 16px;position:relative}
.loglist{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.loglist li{background:#14102E;padding:10px 12px;font-size:18px;line-height:1.4}
html[lang=en] .loglist li{font-size:13px}
.loglist small{display:block;color:#C9C2F0;font-family:'DotGothic16',monospace;font-size:12px}
.title-h{margin:0;font-size:56px;line-height:1.2;text-align:center;text-shadow:4px 4px 0 #FF5C93,8px 8px 0 #14102E}
html[lang=en] .title-h{font-size:54px;line-height:1.05}
.hearts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:6px}
.heart{height:clamp(96px,calc((100dvh - 380px) / 3),150px);border:0;border-radius:0;padding:0;background:#241E52;box-shadow:0 0 0 4px #FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer}
.heart:active{transform:translate(2px,2px)}
.heart.no{background:#3B2F7A;box-shadow:0 0 0 4px #FF8FB1,6px 6px 0 4px #14102E;animation:shake .4s steps(4)}
.heart.yes2{background:#3B2F7A;box-shadow:0 0 0 4px #FFE066,6px 6px 0 4px #FF5C93}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.secmsg{padding:22px 18px}
.bouquet{width:min(68%,264px);height:auto}
@media (prefers-reduced-motion:reduce){.heart.no{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

$('dlg').onclick=function(){clearInterval(typer);$('charSay').textContent=full};
$('dlg').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('dlg').onclick()}};
$('nameForm').onsubmit=function(e){e.preventDefault();var v=$('nameInput').value.trim();if(!v){$('nameErr').textContent=t('emptyName');$('nameInput').focus();return}
 if(SECRET.indexOf(norm(v))>-1){$('nameErr').textContent='';$('nameInput').value='';goSecret();return}
 var f=findFriend(v);if(f===null){$('nameErr').textContent=t('noName');return}S.friend=f;S.name=v;S.mood=null;S.pick=null;$('nameErr').textContent='';show('s-mood')};

var SECRET=['اداتشي','فقمه'],LOVE=['لينه','ملاك','lenah','malak'];
function goSecret(){var hs=document.querySelectorAll('.heart');for(var i=0;i<hs.length;i++)hs[i].className='heart';$('heartMsg').hidden=true;$('snameInput').value='';$('snameErr').textContent='';show('s-hearts')}
$('hearts').onclick=function(e){var b=e.target.closest('.heart');if(!b)return;var hs=document.querySelectorAll('.heart');for(var i=0;i<hs.length;i++)hs[i].className='heart';
 if(b.getAttribute('data-heart')==='layered'){b.className='heart yes2';$('heartMsg').hidden=true;setTimeout(function(){show('s-sname');$('snameInput').focus()},300)}
 else{void b.offsetWidth;b.className='heart no';$('heartMsg').hidden=false}};
$('snameForm').onsubmit=function(e){e.preventDefault();var v=norm($('snameInput').value);if(LOVE.indexOf(v)>-1){$('snameErr').textContent='';show('s-bouquet')}else{$('snameErr').textContent='مو موجه لك عزيزتي'}};
$('snameInput').oninput=function(){$('snameErr').textContent=''};
$('nameInput').oninput=function(){$('nameErr').textContent=''};
$('startBtn').onclick=function(){if(S.pick===null){$('pickErr').textContent=t('pickFirst');return}show('s-reveal')};
document.addEventListener('click',function(e){var g=e.target.closest('[data-go]');if(g){show(g.getAttribute('data-go'))}});
$('logBtn').onclick=function(){var ul=$('logList');ul.innerHTML='';var log=(store('wip_log')||[]).filter(function(x){return x.f===S.friend});
 if(!log.length){var li=document.createElement('li');li.textContent=t('emptyLog');ul.appendChild(li)}
 log.forEach(function(x){var c=D.friends[x.f]&&D.friends[x.f].chars[x.c];if(!c)return;var li=document.createElement('li');var s=document.createElement('small');s.textContent=new Date(x.d).toLocaleDateString(S.lang==='ar'?'ar':'en-GB',{day:'numeric',month:'short',year:'numeric'});li.appendChild(s);
  li.appendChild(document.createTextNode(disp(S.lang==='ar'?D.moods[x.m]:MOOD_EN[x.m])+' · '+c.name));ul.appendChild(li)});
 $('logOv').classList.add('on');$('logClose').focus()};
$('logClose').onclick=function(){$('logOv').classList.remove('on');$('logBtn').focus()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('logOv').classList.contains('on'))$('logClose').onclick()});
function petals(id){var old=document.querySelectorAll('.petal');for(var i=0;i<old.length;i++)old[i].remove();if(id!=='s-reveal'&&id!=='s-title'&&id!=='s-bouquet')return;var sc=$(id);
 for(i=0;i<9;i++){var p=document.createElement('span');p.className='petal';p.style.left=(8+Math.random()*90)+'%';p.style.animationDuration=(7+Math.random()*7)+'s';p.style.animationDelay=(-Math.random()*12)+'s';if(i%3===0){p.style.background='#FFFFFF';p.style.width='6px';p.style.height='6px'}if(id==='s-bouquet'&&i%3!==0)p.style.background=i%2?'#FFD23F':'#F6B800';sc.insertBefore(p,sc.children[1])}}
applyLang();petals('s-title');
})();
</script>
</body>
</html>
